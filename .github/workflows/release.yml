# Release artifacts: Python wheels for every platform, CLI binaries, and
# the C ABI shared library.
#
# Why a matrix at all: `crates/cgg-py` and `crates/cgg-ffi` are compiled
# extensions, so a wheel or a `.so` only runs on the platform it was built
# for. Cross-compiling to macOS needs Apple's SDK and to Windows needs the
# MSVC toolchain, neither of which is practical from a Linux box — so each
# target gets a runner that is already that platform.
#
# `abi3-py39` keeps this small: one wheel per PLATFORM covers every
# CPython from 3.9 up, so this is six wheels rather than six times seven.
#
# Triggered by a `v*` tag. `workflow_dispatch` builds everything but
# publishes nothing, so the matrix can be exercised without a release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to attach binaries to the GitHub release

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2014" }
          # Built under QEMU in a manylinux container. Slow (tens of
          # minutes for 44 grammars) but it needs no ARM runner.
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `auto` on Linux picks the oldest glibc it can, which is what
          # makes the wheel installable on more than just the runner.
          # PyPI rejects a plain `linux_x86_64` tag outright.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/cgg-py/Cargo.toml
          sccache: "true"

      # Prove the wheel imports and analyses before it is ever uploaded.
      # A wheel that builds and does not load is the failure this catches.
      - name: Smoke test
        if: matrix.name != 'linux-aarch64' && matrix.name != 'macos-x86_64' # host cannot execute the target
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index cgg-callgraphgenerator
          python -c "
          import cgg
          g = cgg.analyze('crates/cgg-walk')
          assert len(g.callables) > 0, 'no callables'
          assert g.to_mermaid().startswith('flowchart'), 'bad mermaid'
          print('ok', cgg.__version__, len(g.callables), 'callables')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/cgg-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Node.js. The per-platform packages are npm's standard model for a
  # native module (esbuild, swc and napi-rs itself all ship this way): the
  # main package lists them as optionalDependencies, and npm installs only
  # the one matching the host. It needs no install script, so it survives
  # `npm ci --ignore-scripts` — which a source-build postinstall does not.
  node:
    name: node (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gnu, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64-gnu, os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { name: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: win32-x64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `npx @napi-rs/cli@<exact>` rather than `npm ci` + `npx napi`.
      # The CLI's *-wasm32-wasi optional dependencies resolve differently
      # on a runner than they did locally, and `npm ci` fails hard on that
      # ("lock file's @emnapi/runtime@1.11.2 does not satisfy 2.0.0-alpha.3").
      # Nothing here needs a reproducible node_modules — the .node is
      # determined by Rust — so pinning the one tool we invoke is both
      # simpler and stricter than trusting a lock across platforms.
      # cgg compiles C — blake3, and the vendored tree-sitter grammars —
      # so an ARM build needs a cross-compiler the x86 runner does not
      # ship. (The Python ARM wheel does not need this because maturin's
      # manylinux container brings its own.)
      - name: Install ARM cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        working-directory: crates/cgg-node
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx --yes --package=@napi-rs/cli@3.8.5 -- napi build --platform --release --target ${{ matrix.target }}

      # Load the module and make it analyse a real tree. A .node that
      # builds and does not load is the failure a build-only matrix ships.
      - name: Smoke test
        if: matrix.name != 'linux-arm64-gnu' && matrix.name != 'darwin-x64' # host cannot execute the target
        working-directory: crates/cgg-node
        run: |
          node -e "
          const cgg = require('./index.js');
          const g = cgg.analyzeSync('../cgg-walk');
          if (g.callableCount < 1) { throw new Error('no callables'); }
          if (!g.toMermaid().startsWith('flowchart')) { throw new Error('bad mermaid'); }
          console.log('ok', cgg.version(), g.callableCount, 'callables');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.name }}
          path: crates/cgg-node/*.node

  binaries:
    name: binaries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The CLI and the C ABI together: someone linking libcgg needs the
      # header, and someone using the CLI needs neither. Shipping them in
      # one archive per platform keeps the release page short.
      # Two invocations, not `-p cgg -p cgg-ffi`. Building the binary and
      # the staticlib in one command fails to link on Windows with a wall
      # of LNK2019 unresolved-symbol errors out of clap and alloc; built
      # separately, each links cleanly.
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p cgg
          cargo build --release --target ${{ matrix.target }} -p cgg-ffi

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          T="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$T/cgg.exe" out/
            cp "$T/cgg.dll" out/ 2>/dev/null || true
            cp "$T/cgg.lib" out/ 2>/dev/null || true
          else
            cp "$T/cgg" out/
            # Explicit extensions, not `libcgg.*`: that glob also matched
            # `libcgg.d` (a make-style dep-info file) and `libcgg.rlib`
            # (the Rust lib target's archive, unusable from C), both of
            # which shipped in the v0.6.4 tarballs.
            cp "$T"/libcgg.so out/ 2>/dev/null || true
            cp "$T"/libcgg.dylib out/ 2>/dev/null || true
            cp "$T"/libcgg.a out/ 2>/dev/null || true
          fi
          cp crates/cgg-ffi/include/cgg.h out/
          cp README.md LICENSE-APACHE LICENSE-MIT out/
          tar czf "cgg-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: cgg-*.tar.gz

  publish:
    name: publish
    needs: [wheels, sdist, binaries, node]
    runs-on: ubuntu-latest
    # Only on a tag. A manual run builds and tests everything but
    # publishes nothing, so the matrix is safe to exercise any time.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release # gate this in repo settings if you want approval
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Collect
        run: |
          mkdir -p dist bin
          find artifacts -name '*.whl' -o -name '*.tar.gz' | while read -r f; do
            case "$f" in
              *cgg-v*) cp "$f" bin/ ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -la dist bin

      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*

      # Trusted publishing: no token in secrets at all. Configure the
      # publisher once at
      # https://pypi.org/manage/project/cgg-callgraphgenerator/settings/publishing/
      # (owner NeuralNotwerk, repo cgg, workflow release.yml, environment
      # release). Delete the `password:` line below once that is set up.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run of a tag must not fail on files already uploaded.
          skip-existing: true

      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }

      # `napi prepublish` moves each .node into its npm/<triple>/ package,
      # publishes those, then publishes the main package that depends on
      # them. Order matters: the main package's optionalDependencies must
      # already exist.
      - name: Publish to npm
        working-directory: src/crates/cgg-node
        env:
          # NPM_TOKEN must be an *automation* token, or a granular token
          # with "bypass 2FA" enabled. A classic read/publish token on a
          # 2FA-protected account is rejected with:
          #   403 … Two-factor authentication or granular access token
          #   with bypass 2fa enabled is required to publish packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # `napi artifacts` is not optional: `prepublish` validates that
          # every npm/<triple>/ package already CONTAINS its .node, and
          # aborts with "Release package … is incomplete" otherwise.
          # Copying the files to the crate root is not enough.
          npx --yes --package=@napi-rs/cli@3.8.5 -- napi artifacts \
              -d ../../../artifacts --npm-dir npm
          find npm -name '*.node' -exec ls -la {} \;
          # `--gh-release` is opt-IN in @napi-rs/cli v3; there is no
          # `--skip-gh-release`, and passing it aborts with "Unsupported
          # option name". The GitHub release is created by the step above.
          npx --yes --package=@napi-rs/cli@3.8.5 -- napi prepublish -t npm
