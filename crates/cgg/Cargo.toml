[package]
name        = "cgg"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "Call graph generator — point at folders, get a graph."
default-run = "cgg"

[[bin]]
name = "cgg"
path = "src/main.rs"

[dependencies]
cgg-core    = { workspace = true }
cgg-lang    = { workspace = true }
cgg-resolve = { workspace = true }
cgg-format  = { workspace = true }
cgg-walk    = { workspace = true }

blake3 = { workspace = true }

anyhow             = { workspace = true }
clap               = { workspace = true }
glob               = { workspace = true }
rayon              = { workspace = true }
regex              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }

# The *only* network dependency, and only in the binary: a best-effort,
# opt-out, once-a-day "newer release?" check (see src/update_check.rs).
# rustls (no system OpenSSL) keeps the single-binary property.
minreq             = { version = "2", default-features = false, features = ["https-rustls"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta      = { workspace = true }
tempfile   = { workspace = true }
