# cargo-deny configuration
# License policy: only permissive licenses are permitted.
# Updated for cargo-deny 0.16+ which uses SPDX expression matching.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
# Confidence threshold for SPDX detection.
confidence-threshold = 0.85
# Permissive-only allow-list, per the cgg design constraint.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "Zlib",
    "MPL-2.0",        # File-level copyleft; webpki etc. MPL-2.0 is acceptable here.
    "OpenSSL",        # Dual-license OpenSSL-style; no OpenSSL bindings are a hard dep anyway.
    "MIT-0",
    "Unicode-3.0",    # Permissive, OSI-approved; used by unicode-ident.
]
# License exceptions for specific crates that ship no runtime code or are
# clearly documented as permissive despite ambiguous top-level license fields.
exceptions = []

[[licenses.clarify]]
name    = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "allow"
wildcards         = "warn"

[advisories]
version = 2
yanked  = "warn"
ignore  = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
