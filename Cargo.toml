[workspace]
resolver = "2"
members = [
    "crates/cgg-core",
    "crates/cgg-lang",
    "crates/cgg-resolve",
    "crates/cgg-format",
    "crates/cgg-walk",
    "crates/cgg",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/NeuralNotwerk/cgg"
authors = ["cgg contributors"]

[workspace.dependencies]
# --- Internal crates ---
cgg-core    = { path = "crates/cgg-core",    version = "0.4.1" }
cgg-lang    = { path = "crates/cgg-lang",    version = "0.4.1" }
cgg-resolve = { path = "crates/cgg-resolve", version = "0.4.1" }
cgg-format  = { path = "crates/cgg-format",  version = "0.4.1" }
cgg-walk    = { path = "crates/cgg-walk",    version = "0.4.1" }

# --- Core libs (all MIT / Apache-2.0 / permissive) ---
anyhow             = "1.0"
thiserror          = "1.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
toml               = "0.8"
indexmap           = { version = "2.2", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap               = { version = "4.5", features = ["derive", "wrap_help"] }
regex              = "1.10"
glob               = "0.3"
globset            = "0.4"
ignore             = "0.4"
rayon              = "1.10"
blake3             = "1.5"
memory-stats       = "1.2"
petgraph           = { version = "0.6", features = ["serde-1"] }

# --- Parsers and grammars (all MIT) ---
tree-sitter             = "0.26"
tree-sitter-rust        = "0.24"
tree-sitter-python      = "0.25"
tree-sitter-javascript  = "0.25"
tree-sitter-typescript  = "0.23"
tree-sitter-go          = "0.25"
tree-sitter-java        = "0.23"
tree-sitter-c           = "0.24"
tree-sitter-cpp         = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-c-sharp     = "0.23"

# --- Additional language grammars ---
tree-sitter-kotlin-sg   = "0.4"
tree-sitter-bash        = "0.25"
tree-sitter-ruby        = "0.23"
tree-sitter-swift       = "0.7"
tree-sitter-lua         = "0.5"
tree-sitter-php         = "0.24"
tree-sitter-dart        = "0.2"
tree-sitter-scala       = "0.26"
tree-sitter-hcl         = "1.1"
tree-sitter-zig         = "1.1"
tree-sitter-objc        = "3.0"
tree-sitter-r           = "1.2"
tree-sitter-groovy      = "0.1"
tree-sitter-haskell     = "0.23"
tree-sitter-erlang      = "0.16"
tree-sitter-julia       = "0.23"
tree-sitter-elixir      = "0.3"
tree-sitter-fortran     = "0.6"
tree-sitter-perl        = "1.1"
tree-sitter-ocaml       = "0.25"
tree-sitter-powershell  = "0.26"
tree-sitter-solidity    = "1.2"
tree-sitter-fsharp      = "0.3"
tree-sitter-starlark    = "1.3"
tree-sitter-cmake       = "0.7"
tree-sitter-nix         = "0.3"
tree-sitter-verilog     = "1.0"
tree-sitter-vhdl        = "1.4"
tree-sitter-asm         = "0.24"

# --- Descriptor / interface-definition languages ---
tree-sitter-proto       = "0.4"
tree-sitter-graphql     = "0.1"
# YAML grammar — also parses JSON (JSON is flow-style YAML). Used by the
# OpenAPI/Swagger and AsyncAPI structured-document plugins.
tree-sitter-yaml        = "0.7"
# Raw LanguageFn binding for the vendored Smithy grammar (see cgg-lang/build.rs).
tree-sitter-language    = "0.1"
# Compiles the vendored Smithy parser.c in cgg-lang/build.rs.
cc                      = "1"

# --- Dev / test ---
assert_cmd    = "2.0"
predicates    = "3.1"
insta         = { version = "1.39", features = ["json", "yaml"] }
tempfile      = "3.10"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
